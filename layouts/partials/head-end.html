{{- if templates.Exists "partials/head-custom.html" -}}
  {{- partial "head-custom.html" . -}}
{{- end -}}

<!-- 视口设置 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- iOS Safari 优化 -->
<meta name="apple-mobile-web-app-title" content="吉大课程攻略">

<!-- 状态栏颜色跟随设计系统(浅色 #fbfbfd / 深色 #0a0a0c) -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0c">

<!-- 禁止自动识别电话号码 -->
<meta name="format-detection" content="telephone=no">

<!-- PWA -->
<link rel="manifest" href="{{ "manifest.json" | absURL }}">

<!-- 预连接到资源域名 -->
<link rel="preconnect" href="https://github.com">
<link rel="dns-prefetch" href="https://github.com">
