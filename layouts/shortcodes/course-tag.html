{{- $type := .Get "type" -}}
{{- $text := .Get "text" -}}

{{- $known := slice
  "difficulty-easy" "difficulty-medium" "difficulty-hard"
  "required" "elective" "theory" "lab" "project"
-}}
{{- if not (in $known $type) -}}
  {{- $type = "default" -}}
{{- end -}}

<span class="course-tag course-tag--{{ $type }}">{{ $text }}</span>
